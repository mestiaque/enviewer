[package]
name = "lumen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ENViewer – a fast, premium image viewer and photo browser"
default-run = "lumen"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["heif"]
heif = ["lumen-core/heif"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumen-core = { path = "../crates/lumen-core", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
percent-encoding = "2"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
