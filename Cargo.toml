[workspace]
resolver = "2"
members = ["crates/lumen-core", "src-tauri"]

[workspace.package]
version = "0.2.9"
edition = "2021"
license = "MIT"
authors = ["M. Estiaque Ahmed Khan <info@mestiaque.com>"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

# Image decoders are painfully slow without optimisation; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3
