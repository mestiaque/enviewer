# Tests and bundles ENViewer for Ubuntu (.deb, AppImage) and Windows (NSIS installer).
# Pushing a tag like v0.2.1 publishes a GitHub Release with the installers attached;
# installed copies of ENViewer find it through their built-in update check.
name: build

# Full Windows + Linux bundling is slow (~30 min), so it runs for release tags, pull
# requests and manual runs only — not for every push to master.
on:
  push:
    tags: ["v*"]
  pull_request:
    # Documentation and screenshots never need a build.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# A newer run for the same tag/branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        # apt on the hosted runner occasionally hangs on a mirror: bound each try and retry.
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            timeout 300 sudo apt-get $APT update &&
            timeout 900 sudo -E apt-get $APT install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
              libayatana-appindicator3-dev libssl-dev libxdo-dev file patchelf libheif-dev && exit 0
            echo "apt attempt $i failed, retrying…"; sleep 15
          done
          exit 1

      # vcpkg builds libheif from source (~11 min); cache the built package between runs.
      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-libheif-${{ runner.os }}-v1

      - name: libheif (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install libheif:x64-windows
          "LIBHEIF_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Copy libheif DLLs (Windows; tauri.windows.conf.json bundles them, cargo test needs them too)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/dlls | Out-Null
          Copy-Item "$env:LIBHEIF_DIR\bin\*.dll" src-tauri/dlls/

      # vcpkg's libheif DLLs need the Visual C++ runtime (VCRUNTIME140.dll, MSVCP140.dll), which a
      # fresh Windows does not have ("VCRUNTIME140.dll was not found"). ENViewer.exe links it
      # statically (tauri-build), so ship Microsoft's redistributable DLLs next to the exe
      # (app-local deployment): installer and portable zip both work without vc_redist.
      - name: Visual C++ runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ redistributable folder not found under $vs" }
          Write-Host "Visual C++ runtime from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" src-tauri/dlls/
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not (Test-Path "src-tauri/dlls/$dll")) { throw "$dll missing" }
          }
          # Every DLL the bundled libraries import must be in Windows itself or in dlls/.
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $bundled = (Get-ChildItem src-tauri/dlls/*.dll).Name.ToLower()
          $missing = @()
          foreach ($f in Get-ChildItem src-tauri/dlls/*.dll) {
            $deps = & $dumpbin.FullName /nologo /dependents $f.FullName | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLower() }
            foreach ($d in $deps) {
              if ($bundled -contains $d) { continue }
              if ($d -like 'api-ms-*' -or $d -like 'ext-ms-*') { continue }
              if (Test-Path "$env:SystemRoot\System32\$d") {
                # Present on this build machine but not part of Windows: must be bundled.
                if ($d -match '^(vcruntime|msvcp|concrt|vcomp|ucrtbased)') { $missing += "$($f.Name) -> $d" }
                continue
              }
              $missing += "$($f.Name) -> $d"
            }
          }
          if ($missing) { throw "Bundled DLLs import libraries that are not shipped:`n$($missing -join "`n")" }
          Get-ChildItem src-tauri/dlls | Format-Table Name, Length

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # --release: the bundle step below reuses these compiled crates instead of building twice.
      - run: cargo test --release --workspace

      - name: Bundle
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ runner.os == 'Windows' && '--config src-tauri/tauri.windows.conf.json' || '' }}

      - name: Portable executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item target/release/enviewer.exe portable/ENViewer.exe
          Copy-Item src-tauri/dlls/*.dll portable/
          Compress-Archive -Path portable/* -DestinationPath ENViewer-portable-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: enviewer-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            ENViewer-portable-windows-x64.zip

  snap:
    name: Ubuntu snap
    needs: [test-and-bundle]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true   # the snap must not block the other releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: enviewer-ubuntu-22.04
          path: out
      - run: |
          mkdir -p snap/local
          cp "$(find out -name '*.deb' | head -1)" snap/local/enviewer.deb
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: enviewer-snap
          path: ${{ steps.snap.outputs.snap }}

  release:
    name: Publish release
    # Publish whatever built (Linux alone is enough), so one broken platform never blocks updates.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-and-bundle, snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Collect files
        run: |
          mkdir -p files
          find out -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.zip' -o -name '*.snap' \) -exec cp {} files/ \;
          ls -l files
          test -n "$(ls files)"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src
      - name: Release notes
        # What the in-app update dialog shows: the changes since the previous version (commit
        # titles, without CI/docs housekeeping), not GitHub's generated "Full Changelog" link.
        run: |
          prev=$(git -C src describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "What's new in ${GITHUB_REF_NAME#v}:"
            echo
            git -C src log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" \
              | grep -viE '^- (CI|README|Docs?|Status report)\b' || true
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          body_path: release-notes.md
